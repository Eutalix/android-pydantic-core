name: Build Android Wheels

on:
  workflow_dispatch:
    inputs:
      pydantic_core_ref:
        description: >-
          Git ref to build, resolved against pydantic/pydantic (the
          monorepo pydantic-core now lives in). Can be "main", a branch,
          or a commit SHA. check_upstream.yml always passes an exact
          commit SHA here.
        required: true
        default: "main"
      release_version:
        description: >-
          Exact pydantic-core version this ref corresponds to. Set
          automatically by check_upstream.yml. Leave empty for an ad hoc
          build — a release is only published when this resolves to a
          non-empty value (either from this input directly, or parsed
          from pydantic_core_ref if it happens to look like a version).
        required: false
        default: ""
      dry_run:
        description: "Build and smoke-test only; never publish a GitHub Release."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  ANDROID_API_LEVEL: 24
  NDK_VERSION: "26.3.11579264"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.discover.outputs.python_version }}
      release_version: ${{ steps.resolve_ref.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ci_tool
        run: pip install -e ./ci_tool

      - id: discover
        name: Discover currently-served Termux python version
        run: |
          python -m ci_tool discover-python-version \
            --abi arm64-v8a \
            --github-output "$GITHUB_OUTPUT"

      - id: resolve_ref
        name: Resolve the release version for this build, if any
        run: |
          python -m ci_tool resolve-ref \
            --ref "${{ inputs.pydantic_core_ref }}" \
            --version "${{ inputs.release_version }}" \
            --github-output "$GITHUB_OUTPUT"

      - run: echo "Building against Termux python ${{ steps.discover.outputs.python_version }}"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android_abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pydantic (monorepo containing pydantic-core)
        uses: actions/checkout@v4
        with:
          repository: pydantic/pydantic
          ref: ${{ inputs.pydantic_core_ref }}
          path: pydantic-monorepo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ci_tool
        run: pip install -e ./ci_tool

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Install maturin + binutils + patchelf
        run: |
          pip install maturin
          sudo apt-get update
          sudo apt-get install -y patchelf binutils

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Build + patch + retag wheel
        run: |
          python -m ci_tool build \
            --abi ${{ matrix.android_abi }} \
            --python-version ${{ needs.discover.outputs.python_version }} \
            --android-api-level ${{ env.ANDROID_API_LEVEL }} \
            --ndk-home ${{ steps.ndk.outputs.ndk-path }} \
            --manifest-path pydantic-monorepo/pydantic-core/Cargo.toml \
            --out-dir dist \
            --cache-dir .ci-cache \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.android_abi }}-py${{ needs.discover.outputs.python_version }}
          path: |
            dist/*.whl
            dist/*.whl.json

  smoke-test:
    needs: [discover, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_abi: arm64-v8a
            runner: ubuntu-24.04-arm
          - android_abi: armeabi-v7a
            runner: ubuntu-24.04-arm
          - android_abi: x86_64
            runner: ubuntu-24.04
          - android_abi: x86
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ci_tool
        run: pip install -e ./ci_tool

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-${{ matrix.android_abi }}-*
          path: dist
          merge-multiple: true

      - name: Smoke test against real termux-docker
        run: |
          python -m ci_tool smoke-test \
            --abi ${{ matrix.android_abi }} \
            --wheel-dir dist

  release-notes:
    needs: [discover, build, smoke-test]
    if: needs.discover.outputs.release_version != '' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./ci_tool

      - name: Render release notes
        run: |
          python -m ci_tool release-notes \
            --dist-dir dist \
            --pydantic-core-version "${{ needs.discover.outputs.release_version }}" \
            --ndk-version "${{ env.NDK_VERSION }}" \
            --android-api-level ${{ env.ANDROID_API_LEVEL }} \
            --maturin-version "$(pip index versions maturin 2>/dev/null | head -1 || echo unknown)" \
            --output release_body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.discover.outputs.release_version }}
          body_path: release_body.md
          files: dist/**/*.whl

      - name: Trigger PyPI index rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update_index.yml --ref ${{ github.ref_name }}
