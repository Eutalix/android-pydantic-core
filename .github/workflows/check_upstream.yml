name: Check for New pydantic-core Version

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ci_tool
        run: pip install -e ./ci_tool

      - id: check
        name: Find newest buildable pydantic-core version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m ci_tool check-upstream \
            --repo ${{ github.repository }} \
            --package-name pydantic-core \
            --github-output "$GITHUB_OUTPUT"

      - name: Trigger build for new version
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "New version detected: ${{ steps.check.outputs.package_version }} (commit ${{ steps.check.outputs.upstream_ref }})"
          # Both pydantic_core_ref (a raw commit SHA — pydantic-core has
          # no tags of its own inside the pydantic/pydantic monorepo) and
          # release_version are passed explicitly here, since they're
          # computed together and always in sync; build_wheels.yml can't
          # derive the version from the SHA itself.
          gh workflow run build_wheels.yml \
            --ref ${{ github.ref_name }} \
            -f pydantic_core_ref=${{ steps.check.outputs.upstream_ref }} \
            -f release_version=${{ steps.check.outputs.package_version }}
